name: kaamwala
description: "Kaamwala - Home Services App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # State Management
  flutter_riverpod: ^2.6.1

  # Image Picker (for profile photo)
  image_picker: ^1.1.2

  # HTTP (for Cloudinary upload)
  http: ^1.3.0

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
